<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        form {
            width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 120px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<form action="#" method="post">

    <h2>Student Registration Form</h2>

    <!-- Text Input -->
    <label for="name">Full Name:</label>
    <input type="text"
           id="name"
           name="name"
           placeholder="Enter your name"
           required>

    <!-- Email -->
    <label for="email">Email:</label>
    <input type="email"
           id="email"
           name="email"
           placeholder="example@gmail.com"
           required>

    <!-- Password -->
    <label for="password">Password:</label>
    <input type="password"
           id="password"
           name="password"
           minlength="6"
           required>

    <!-- Number -->
    <label for="age">Age:</label>
    <input type="number"
           id="age"
           name="age"
           min="18"
           max="50">

    <!-- Date -->
    <label for="dob">Date of Birth:</label>
    <input type="date"
           id="dob"
           name="dob">

    <!-- Radio Button -->
    <label>Gender:</label>

    <input type="radio"
           id="male"
           name="gender"
           value="male">
    <label for="male">Male</label>

    <input type="radio"
           id="female"
           name="gender"
           value="female">
    <label for="female">Female</label>

    <!-- Dropdown -->
    <label for="department">Department:</label>

    <select id="department" name="department">
        <option value="">Select Department</option>
        <option value="cis">CIS</option>
        <option value="cse">CSE</option>
        <option value="swe">SWE</option>
        <option value="eee">EEE</option>
    </select>

    <!-- Checkbox -->
    <label>Skills:</label>

    <input type="checkbox"
           id="html"
           name="skills"
           value="html">
    <label for="html">HTML</label>

    <input type="checkbox"
           id="css"
           name="skills"
           value="css">
    <label for="css">CSS</label>

    <input type="checkbox"
           id="js"
           name="skills"
           value="javascript">
    <label for="js">JavaScript</label>

    <!-- File Upload -->
    <label for="photo">Upload Photo:</label>
    <input type="file"
           id="photo"
           name="photo">

    <!-- Textarea -->
    <label for="message">Address:</label>

    <textarea id="message"
              name="address"
              rows="4"
              placeholder="Enter your address"></textarea>

    <!-- Buttons -->
    <div class="buttons">

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </div>

</form>

</body>
</html>
