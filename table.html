<!DOCTYPE html>
<html>
<head>
    <title>Student Result Table</title>

    <style>
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        caption {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        th, td {
            border: 2px solid black;
            padding: 12px;
            text-align: center;
        }

        thead {
            background-color: #333;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tfoot {
            background-color: #ddd;
            font-weight: bold;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<table>

    <caption>Student Result Sheet</caption>

    <thead>
        <tr>
            <th rowspan="2">ID</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Subjects</th>
            <th rowspan="2">GPA</th>
            <th rowspan="2">Status</th>
        </tr>

        <tr>
            <th>HTML</th>
            <th>CSS</th>
            <th>JavaScript</th>
        </tr>
    </thead>

    <tbody>

        <tr>
            <td>101</td>
            <td>Jisan</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
            <td>4.00</td>
            <td class="pass">PASS</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Rahim</td>
            <td>78</td>
            <td>82</td>
            <td>75</td>
            <td>3.75</td>
            <td class="pass">PASS</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Karim</td>
            <td>45</td>
            <td>50</td>
            <td>40</td>
            <td>2.50</td>
            <td class="fail">FAIL</td>
        </tr>

    </tbody>

    <tfoot>
        <tr>
            <td colspan="5">Class Average</td>
            <td>3.41</td>
            <td>---</td>
        </tr>
    </tfoot>

</table>

</body>
</html>
